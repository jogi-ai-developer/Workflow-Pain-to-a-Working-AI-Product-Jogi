openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyses
    description: Funnel analysis operations
  - name: admin
    description: Aggregate analysis metrics
  - name: hypotheses
    description: Evidence-aware funnel hypothesis generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyses:
    get:
      operationId: listAnalyses
      tags: [analyses]
      summary: List recent funnel analyses
      responses:
        "200":
          description: Recent analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisSummary"
    post:
      operationId: createAnalysis
      tags: [analyses]
      summary: Analyze a funnel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "201":
          description: Completed analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          description: Invalid funnel input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Analysis service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
  /analyses/{id}:
    get:
      operationId: getAnalysis
      tags: [analyses]
      summary: Get one saved funnel analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Analysis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /analyses/{id}/retry:
    post:
      operationId: retryAnalysis
      tags: [analyses]
      summary: Retry AI hypotheses for a failed funnel analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRetryInput"
      responses:
        "200":
          description: Analysis with regenerated hypotheses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          description: Invalid retry request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Analysis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Analysis is already being retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Analysis service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get aggregate analysis metrics
      responses:
        "200":
          description: Aggregate metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /hypotheses:
    post:
      operationId: generateHypotheses
      tags: [hypotheses]
      summary: Generate evidence-aware hypotheses for flagged funnel steps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HypothesisRequest"
      responses:
        "200":
          description: Validated evidence-aware hypotheses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypothesisResult"
        "400":
          description: Invalid or unflagged evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: AI output did not match the required evidence-aware format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FunnelStepInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        order:
          type: integer
          minimum: 1
        entered:
          type: integer
          minimum: 0
        converted:
          type: integer
          minimum: 0
        description:
          type: string
      required: [name, order, entered, converted]
    AnalysisInput:
      type: object
      properties:
        steps:
          type: array
          minItems: 3
          maxItems: 6
          items:
            $ref: "#/components/schemas/FunnelStepInput"
        context:
          type: string
          description: Deprecated alias for additionalContext
          deprecated: true
          maxLength: 2000
        funnelGoal:
          type: string
          maxLength: 500
          description: Optional goal for the funnel being diagnosed
        recentChanges:
          type: string
          maxLength: 2000
          description: Optional recent product, campaign, or instrumentation changes
        additionalContext:
          type: string
          maxLength: 2000
          description: Optional business or instrumentation context for hypothesis generation
      required: [steps]
    StepResult:
      type: object
      properties:
        name:
          type: string
        order:
          type: integer
        entered:
          type: integer
        converted:
          type: integer
        description:
          type: string
        conversionRate:
          type: number
        dropOffPercent:
          type: number
        usersLost:
          type: integer
        isAbnormal:
          type: boolean
        evidenceStrength:
          $ref: "#/components/schemas/EvidenceStrength"
      required: [name, order, entered, converted, conversionRate, dropOffPercent, usersLost, isAbnormal, evidenceStrength]
    EvidenceStrength:
      type: string
      enum: [high, medium, low, insufficient]
    LogicResult:
      type: object
      properties:
        thresholdPercent:
          type: number
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepResult"
        flaggedSteps:
          type: array
          items:
            type: string
        hasAbnormalDropOff:
          type: boolean
        hasActionableDropOff:
          type: boolean
        hasInsufficientEvidence:
          type: boolean
        evidenceStrength:
          $ref: "#/components/schemas/EvidenceStrength"
      required: [thresholdPercent, steps, flaggedSteps, hasAbnormalDropOff, hasActionableDropOff, hasInsufficientEvidence, evidenceStrength]
    AiResult:
      type: object
      properties:
        likelyCauses:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            minLength: 1
        hypotheses:
          type: array
          minItems: 2
          maxItems: 3
          items:
            type: string
            minLength: 1
        missingEvidence:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            minLength: 1
        suggestedInvestigation:
          type: string
          minLength: 1
        recommendedInvestigation:
          type: string
          minLength: 1
        suggestedExperiment:
          type: string
          minLength: 1
        confidence:
          type: string
          enum: [high, medium, low]
        reasoning:
          type: string
          minLength: 1
      required: [likelyCauses, hypotheses, missingEvidence, suggestedInvestigation, recommendedInvestigation, suggestedExperiment, confidence, reasoning]
    HypothesisResult:
      type: object
      properties:
        likelyCauses:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            minLength: 1
        hypotheses:
          type: array
          minItems: 2
          maxItems: 3
          items:
            type: string
            minLength: 1
        missingEvidence:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            minLength: 1
        suggestedInvestigation:
          type: string
          minLength: 1
        suggestedExperiment:
          type: string
          minLength: 1
        confidence:
          type: string
          enum: [high, medium, low]
        reasoning:
          type: string
          minLength: 1
      required: [likelyCauses, hypotheses, missingEvidence, suggestedInvestigation, suggestedExperiment, confidence, reasoning]
    HypothesisRequest:
      type: object
      properties:
        thresholdPercent:
          type: number
          minimum: 0
          maximum: 100
        flaggedSteps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StepResult"
      required: [thresholdPercent, flaggedSteps]
    Analysis:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: string
        input:
          $ref: "#/components/schemas/AnalysisInput"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FunnelStepInput"
        logic:
          $ref: "#/components/schemas/LogicResult"
        ai:
          oneOf:
            - $ref: "#/components/schemas/AiResult"
            - type: "null"
        confidence:
          type: string
          enum: [high, medium, low]
        status:
          type: string
          enum: [loading, ok, no-flag, inconclusive, api-error, ai-parse-error]
        isStale:
          type: boolean
          description: Whether a loading investigation has exceeded the recovery threshold
        errorMessage:
          type: ["string", "null"]
      required: [id, timestamp, input, steps, logic, ai, confidence, status, isStale, errorMessage]
    AnalysisRetryInput:
      type: object
      properties:
        funnelGoal:
          type: string
          maxLength: 500
          description: Optional goal for the funnel being diagnosed
        recentChanges:
          type: string
          maxLength: 2000
          description: Optional recent product, campaign, or instrumentation changes
        additionalContext:
          type: string
          maxLength: 2000
          description: Optional business or instrumentation context for hypothesis generation
    AnalysisSummary:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: string
        flaggedSteps:
          type: array
          items:
            type: string
        confidence:
          type: string
          enum: [high, medium, low]
        status:
          type: string
          enum: [loading, ok, no-flag, inconclusive, api-error, ai-parse-error]
        isStale:
          type: boolean
          description: Whether a loading investigation has exceeded the recovery threshold
      required: [id, timestamp, flaggedSteps, confidence, status, isStale]
    AdminSummary:
      type: object
      properties:
        totalAnalyses:
          type: integer
        confidenceCounts:
          type: object
          properties:
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
          required: [high, medium, low]
        aiErrorCount:
          type: integer
        recentAnalyses:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisSummary"
      required: [totalAnalyses, confidenceCounts, aiErrorCount, recentAnalyses]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

